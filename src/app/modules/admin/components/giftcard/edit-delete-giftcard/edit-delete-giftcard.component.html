<div class="title-functionality flex center">
  <h4 class="flex center">Gérer les Cartes Cadeaux</h4>
  <i class="fa-solid fa-arrow-down"
     (click)="isTableVisible = !isTableVisible"
     [ngClass]="{'rotated180': isTableVisible}">
  </i>
</div>

<div *ngIf="!giftcards || giftcards.length <= 0">Aucun Article</div>
<table *ngIf="giftcards && isTableVisible">
  <thead>
    <tr>
      <td>
        <p>Date Fin Validité</p>
      </td>
      <td>
        <p>Code</p>
      </td>
      <td>
        <p>Réduction</p>
      </td>    
      <td>
        <p>Supp.</p>
      </td>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let giftcard of giftcards ; let index = index"
        [ngClass]="index % 2 ? 'bg-dark' : ''">
      <td>
        <p class="flex text-left pointer"
           [routerLink]="'/admin/utilisateurs-carte-cadeaux/' + giftcard.code">
          {{ giftcard.expiryDate | date : 'dd/MM/yyyy' }}
        </p>
      </td>
      <td>
        <p class="title pointer"
           [routerLink]="'/admin/utilisateurs-carte-cadeaux/' + giftcard.code">
          {{ giftcard.code }}
        </p>
      </td>
      <td>
        <p class="pointer"
           [routerLink]="'/admin/utilisateurs-carte-cadeaux/' + giftcard.code">
          {{ giftcard.rising | number: '0.2' }}  {{ giftcard.percentage ? ' %' : ' €' }}
        </p>
      </td>
      <td>
        <i (click)="delete(giftcard)" class="fa-solid fa-trash-can pointer flex center"></i>
      </td>
    </tr>
  </tbody>
</table>
