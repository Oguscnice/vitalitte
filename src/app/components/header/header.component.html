<nav class="flex space-between center" #navBar>
  <img src="../../../assets/images/figma/icone.png"
       alt="Logo du site VitaLitté"
       class="pointer"/>
  <h3 class="flex pointer"
      [routerLink]="'/'">VitaLitté</h3>
  <div class="shopping-cart-counter pointer"
       [ngClass]="shoppingCart.counterTotalShoppingCart() > 0 ? 'visible-linear' : 'invisible-linear'"
       (click)="changeModalShoppingCartVisibility(!isShoppingCartListOpen)">
    <i class="fa-solid fa-cart-shopping"></i>
    <p class="flex center"> {{ shoppingCart.counterTotalShoppingCart() }} </p>
  </div>
  @if (isShoppingCartListOpen) {
    <app-modal-shopping-cart-list (click)="isShoppingCartListOpen = !isShoppingCartListOpen"/>
  }

  <ul
    class="flex center space-around"
    [ngClass]="
      isMenuBurgerChecked && !initialLoad
        ? 'menu-burger-visible'
        : !isMenuBurgerChecked && !initialLoad
        ? 'menu-burger-hidden'
        : '' ">
    @for (item of navbarUser; track item; let index = $index) {
      <li [routerLink]="item.submenu ? null : item.routerLink"
          class="flex center column pointer"
          [ngClass]="{
            'active': item.routerLink === activePageService.activePage,
            'separator': index !== navbarUser.length - 1 }"
          (click)="item.submenu ?
                    openSubmenu(item) :
                    closeMenuBurger(item.routerLink, $event) ">
        <p class="flex center"
          [ngClass]="{
            'active': item.routerLink === activePageService.activePage,
            'submenu-close' : item.submenu && item.submenu.isOpen }">
          {{ item.name }}
        </p>
        @if (item.submenu) {
          <div class="flex center space-around submenu"
              [ngClass]="item.submenu.isOpen ? '' : 'close' ">

              @for (subItem of item.submenu.items; track subItem) {
                <a class="flex center"
                  [href]="item.routerLink + '#' + subItem.anchor"
                  (click)="closeMenuBurger(item.routerLink, $event)">
                  {{ subItem.name }}
                </a>
              }
          </div>
        }

      </li>
    }

  </ul>
  <input type="checkbox" id="checkbox" #menuCheckbox (click)="changeMenuBurgerVisibility()" />
  <label for="checkbox" class="toggle">
    <div class="bars" id="bar1"></div>
    <div class="bars" id="bar2"></div>
    <div class="bars" id="bar3"></div>
    <div class="bars" id="bar4"></div>
  </label>
</nav>
