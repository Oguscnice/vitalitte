<app-h1 [titleChild]="''"
        [backgroundImageChild]="publicationSelected ? publicationSelected.picture : ''"></app-h1>

<h2 *ngIf="publicationSelected">{{ publicationSelected.title }}</h2>
<p *ngIf="publicationSelected">Actualité créée le {{ publicationSelected.createdAt | date:'dd/MM/yyyy à hh:mm'}}</p>
<div *ngIf="publicationSelected" [innerHTML]="publicationSelected.description"></div>
